name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install boringssl deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build golang-go
      - uses: Swatinem/rust-cache@v2
      - name: pre-commit
        run: |
          pip install nox
          nox -s lint

  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python_version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          # macOS-14 wheels start at 3.8; keep matrix conservative for the
          # native test runs and rely on abi3 wheels for older interpreters.
          - python_version: '3.8'
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - name: install boringssl deps (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build golang-go clang
      - name: install boringssl deps (macos)
        if: matrix.os == 'macos-14'
        run: brew install cmake ninja go
      - name: install boringssl deps (windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y cmake ninja golang
          choco install -y llvm
      - uses: ilammy/setup-nasm@v1
        if: matrix.os == 'windows-latest'
      - name: setup nox
        run: pip install --upgrade pip nox
      - name: run tests
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        run: nox -s test-${{ matrix.python_version }}
      - name: upload coverage data
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python_version }}
          path: ".coverage.*"
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    if: always()
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: install coverage
        run: python -m pip install --upgrade coverage
      - name: download coverage data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: combine and check coverage
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty
          python -m coverage report --ignore-errors --show-missing --fail-under=99
      - name: upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-report
          path: htmlcov

  linux:
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64, aarch64, armv7l, i686 ]
        python_version: [ '3.10', '3.13t', '3.14t' ]
        manylinux: [ 'manylinux2014', 'musllinux_1_1' ]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true

      - name: Build wheels (x86_64)
        if: matrix.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            # Manylinux containers are CentOS-7 / AlmaLinux based; both
            # support `yum`. BoringSSL needs cmake, ninja, go, and clang.
            (yum install -y cmake3 ninja-build golang clang || true)
            (apt-get update && apt-get install -y cmake ninja-build golang-go clang) || true
            # CentOS 7 ships cmake 2.8; alias cmake3 if present.
            (command -v cmake3 && ln -sf "$(command -v cmake3)" /usr/local/bin/cmake) || true

      - name: Build wheels (aarch64 + manylinux2014)
        if: matrix.target == 'aarch64' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8 -DAT_HWCAP2=26"
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            (yum install -y cmake3 ninja-build golang clang || true)
            (apt-get update && apt-get install -y cmake ninja-build golang-go clang) || true
            (command -v cmake3 && ln -sf "$(command -v cmake3)" /usr/local/bin/cmake) || true
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot"

      - name: Build wheels (aarch64 + musllinux_1_1)
        if: matrix.target == 'aarch64' && matrix.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            (apk add --no-cache cmake ninja go clang) || true
            (yum install -y cmake3 ninja-build golang clang || true)
            (apt-get update && apt-get install -y cmake ninja-build golang-go clang) || true
            (command -v cmake3 && ln -sf "$(command -v cmake3)" /usr/local/bin/cmake) || true
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/bin/../aarch64-unknown-linux-musl/"

      - name: Build wheels (armv7l + manylinux2014)
        if: matrix.target == 'armv7l' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            (yum install -y cmake3 ninja-build golang clang || true)
            (apt-get update && apt-get install -y cmake ninja-build golang-go clang) || true
            (command -v cmake3 && ln -sf "$(command -v cmake3)" /usr/local/bin/cmake) || true

      - name: Build wheels (armv7l + musllinux_1_1)
        if: matrix.target == 'armv7l' && matrix.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            (apk add --no-cache cmake ninja go clang) || true
            (yum install -y cmake3 ninja-build golang clang || true)
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/armv7-unknown-linux-musleabihf"

      - name: Build wheels (i686 + manylinux2014)
        if: matrix.target == 'i686' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          container: messense/manylinux2014-cross:i686
          before-script-linux: |
            (yum install -y cmake3 ninja-build golang clang || true)
            (apt-get update && apt-get install -y cmake ninja-build golang-go clang) || true
            (command -v cmake3 && ln -sf "$(command -v cmake3)" /usr/local/bin/cmake) || true
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/i686-unknown-linux-gnu/i686-unknown-linux-gnu/sysroot"

      - name: Build wheels (i686 + musllinux_1_1)
        if: matrix.target == 'i686' && matrix.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            (apk add --no-cache cmake ninja go clang) || true
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/i686-unknown-linux-musl"

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}-${{ matrix.python_version }}
          path: dist/*.whl

  windows:
    needs:
      - test
      - lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x64, aarch64, x86 ]
        python_version: [ '3.10', '3.13t', '3.14t' ]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@v6
        if: matrix.target != 'aarch64'
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.target == 'x86' && 'x86' || 'x64' }}
          allow-prereleases: true
      - uses: ilammy/setup-nasm@v1
      - name: install boringssl toolchain
        run: choco install -y cmake ninja golang llvm
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        if: matrix.target != 'aarch64'
        env:
          XWIN_VERSION: 16
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.python_version }}
          sccache: 'true'
      - name: Build wheels (force CROSS aarch64)
        uses: PyO3/maturin-action@v1
        if: matrix.target == 'aarch64'
        env:
          XWIN_VERSION: 16
          PYO3_CROSS: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.python_version }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-windows-${{ matrix.target }}-${{ matrix.python_version }}
          path: dist/*.whl

  macos:
    needs:
      - test
      - lint
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [ universal2 ]
        python_version: [ '3.10', '3.13t', '3.14t' ]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
      - name: install boringssl deps
        run: brew install cmake ninja go
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python_version }}
          path: dist/*.whl

  sdist:
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  checksum:
    name: compute hashes
    runs-on: ubuntu-latest
    needs: [windows, macos, linux, sdist]
    outputs:
      hashes: ${{ steps.compute.outputs.hashes }}
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Collected dists
        run: |
          ls -la dist
      - name: Generate hashes
        id: compute
        working-directory: ./dist
        run: echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

  provenance:
    needs: checksum
    if: "startsWith(github.ref, 'refs/tags/')"
    uses: "slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0"
    permissions:
      actions: read
      id-token: write
      contents: write
    with:
      base64-subjects: ${{ needs.checksum.outputs.hashes }}
      upload-assets: true
      compile-generator: true

  release:
    name: release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: provenance
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: "Upload dists to GitHub Release"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release upload ${{ github.ref_name }} dist/* --repo ${{ github.repository }}
      - name: Publish to PyPI
        uses: "pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e"
        with:
          attestations: true

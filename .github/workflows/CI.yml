name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install boringssl deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build golang-go
      - uses: Swatinem/rust-cache@v2
      - name: pre-commit
        run: |
          pip install nox
          nox -s lint

  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python_version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          # macOS-14 wheels start at 3.8; keep matrix conservative for the
          # native test runs and rely on abi3 wheels for older interpreters.
          - python_version: '3.8'
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - name: install boringssl deps (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build golang-go clang
      - name: install boringssl deps (macos)
        if: matrix.os == 'macos-14'
        run: brew install cmake ninja go
      - name: install boringssl deps (windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y cmake ninja golang
          choco install -y llvm
      - uses: ilammy/setup-nasm@v1
        if: matrix.os == 'windows-latest'
      - name: setup nox
        run: pip install --upgrade pip nox
      - name: run tests
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        run: nox -s test-${{ matrix.python_version }}
      - name: upload coverage data
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python_version }}
          path: ".coverage.*"
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    if: always()
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: install coverage
        run: python -m pip install --upgrade coverage
      - name: download coverage data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: combine and check coverage
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty
          python -m coverage report --ignore-errors --show-missing --fail-under=99
      - name: upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-report
          path: htmlcov

  linux:
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
    strategy:
      fail-fast: false
      matrix:
        python_version: [ '3.10', '3.13t', '3.14t' ]
        # NOTE: `build` must be a real matrix dimension (not `include:`) so it
        # cross-multiplies with python_version. Each entry below gives 3 jobs
        # (one per Python version), total 5*3=15 linux wheels.
        build:
          # x86_64 keeps the manylinux2014 floor (glibc 2.17). The official
          # image has gcc 4.8 but we install a modern host-arch cmake +
          # libclang via pip; BoringSSL's C++ build still works because
          # x86_64 manylinux2014 ships devtoolset-10 (gcc 10).
          - { target: x86_64,  manylinux: manylinux2014 }
          - { target: x86_64,  manylinux: musllinux_1_1 }
          # aarch64 must use manylinux_2_28 (glibc 2.28, gcc 7.5) because the
          # cross-compile image for manylinux2014 is permanently pinned to
          # gcc 4.8 which cannot compile current BoringSSL (needs C++17).
          # Same policy as the cryptography project. Covers RHEL 8+,
          # Debian 10+, Ubuntu 18.04+, every cloud distro since 2018.
          - { target: aarch64, manylinux: manylinux_2_28 }
          - { target: aarch64, manylinux: musllinux_1_1 }
          # armv7l: no glibc wheel. The cross-image's gcc 4.8 cannot build
          # current BoringSSL, and no manylinux_2_28-cross variant exists
          # for armv7. musllinux still covers Alpine/postmarketOS users.
          - { target: armv7l,  manylinux: musllinux_1_1 }
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true

      - name: Build wheels (x86_64)
        if: matrix.build.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.build.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.build.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            # manylinux2014 ships cmake 3.17 and clang 3.4; BoringSSL needs
            # cmake >= 3.22 and bindgen needs libclang >= 9. Both come from
            # PyPI wheels that link against glibc 2.17, so they are
            # manylinux2014-safe even when used only as host tools.
            if [ -x /opt/python/cp310-cp310/bin/python ]; then
              PY=/opt/python/cp310-cp310/bin/python
              "$PY" -m pip install --quiet --upgrade cmake ninja libclang
              ln -sf /opt/python/cp310-cp310/bin/cmake /usr/local/bin/cmake
              ln -sf /opt/python/cp310-cp310/bin/ninja /usr/local/bin/ninja
              LIBCLANG_DIR=$("$PY" -c 'import os, clang; print(os.path.join(os.path.dirname(clang.__file__), "native"))')
              export LIBCLANG_PATH="$LIBCLANG_DIR"
              echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV" 2>/dev/null || true
            fi
            (apk add --no-cache go clang) || true
            (yum install -y golang clang || true)
            (apt-get update && apt-get install -y golang-go clang) || true

      - name: Build wheels (aarch64 + manylinux_2_28)
        if: matrix.build.target == 'aarch64' && matrix.build.manylinux == 'manylinux_2_28'
        uses: PyO3/maturin-action@v1
        env:
          CC_aarch64_unknown_linux_gnu: clang
          CXX_aarch64_unknown_linux_gnu: clang++
          CFLAGS_aarch64_unknown_linux_gnu: "--target=aarch64-unknown-linux-gnu --sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot --gcc-toolchain=/usr/aarch64-unknown-linux-gnu"
          CXXFLAGS_aarch64_unknown_linux_gnu: "--target=aarch64-unknown-linux-gnu --sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot --gcc-toolchain=/usr/aarch64-unknown-linux-gnu"
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.build.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.build.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            # ghcr.io/rust-cross/manylinux_2_28-cross:aarch64 is Ubuntu-based
            # and ships gcc 7.5 (C++17 capable), cmake 3.22, and clang 14.
            # Only Go is missing; BoringSSL needs it for code generation.
            apt-get update && apt-get install -y golang-go clang
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot"
            # Diagnostics
            echo "crtbeginS.o location: "; find / -name 'crtbeginS.o' 2>/dev/null || true
            echo "libgcc.a location: ";    find / -name 'libgcc.a'    2>/dev/null || true
            echo "cross/gcc tree: "; ls -d /usr/aarch64-unknown-linux-gnu/lib/gcc/*/*/ 2>/dev/null || true

      - name: Build wheels (aarch64 + musllinux_1_1)
        if: matrix.build.target == 'aarch64' && matrix.build.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.build.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.build.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            # musllinux ships cmake 3.27+ via apk; no pip override needed.
            (apk add --no-cache cmake ninja go clang) || true
            (yum install -y cmake3 ninja-build golang clang || true)
            (apt-get update && apt-get install -y cmake ninja-build golang-go clang) || true
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/bin/../aarch64-unknown-linux-musl/"

      - name: Build wheels (armv7l + musllinux_1_1)
        if: matrix.build.target == 'armv7l' && matrix.build.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.build.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.build.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            (apk add --no-cache cmake ninja go clang) || true
            (yum install -y cmake3 ninja-build golang clang || true)
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/armv7-unknown-linux-musleabihf"

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-linux-${{ matrix.build.target }}-${{ matrix.build.manylinux }}-${{ matrix.python_version }}
          path: dist/*.whl

  windows:
    needs:
      - test
      - lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x64, aarch64, x86 ]
        python_version: [ '3.10', '3.13t', '3.14t' ]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        if: matrix.target != 'aarch64'
        with:
          # setup-python@v6 does not parse the trailing `t` suffix; split
          # the base version + freethreaded flag explicitly.
          python-version: ${{ matrix.python_version == '3.13t' && '3.13' || matrix.python_version == '3.14t' && '3.14' || matrix.python_version }}
          freethreaded: ${{ endsWith(matrix.python_version, 't') }}
          architecture: ${{ matrix.target == 'x86' && 'x86' || 'x64' }}
          allow-prereleases: true
      - uses: ilammy/setup-nasm@v1
      - name: install boringssl toolchain
        run: choco install -y cmake ninja golang llvm
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        if: matrix.target != 'aarch64'
        env:
          XWIN_VERSION: 16
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.python_version }}
          sccache: 'true'
      - name: Build wheels (force CROSS aarch64)
        uses: PyO3/maturin-action@v1
        if: matrix.target == 'aarch64'
        env:
          XWIN_VERSION: 16
          PYO3_CROSS: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.python_version }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-windows-${{ matrix.target }}-${{ matrix.python_version }}
          path: dist/*.whl

  macos:
    needs:
      - test
      - lint
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [ universal2 ]
        python_version: [ '3.10', '3.13t', '3.14t' ]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version == '3.13t' && '3.13' || matrix.python_version == '3.14t' && '3.14' || matrix.python_version }}
          freethreaded: ${{ endsWith(matrix.python_version, 't') }}
          allow-prereleases: true
      - name: install boringssl deps
        run: brew install cmake ninja go
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
          # BoringSSL uses C++17 std::optional::value() which is gated on
          # macOS 10.13+ libc++. Force the deployment target to a modern
          # baseline so the universal2 build covers both arches.
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python_version }}
          path: dist/*.whl

  sdist:
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  checksum:
    name: compute hashes
    runs-on: ubuntu-latest
    needs: [windows, macos, linux, sdist]
    outputs:
      hashes: ${{ steps.compute.outputs.hashes }}
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Collected dists
        run: |
          ls -la dist
      - name: Generate hashes
        id: compute
        working-directory: ./dist
        run: echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

  provenance:
    needs: checksum
    if: "startsWith(github.ref, 'refs/tags/')"
    uses: "slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0"
    permissions:
      actions: read
      id-token: write
      contents: write
    with:
      base64-subjects: ${{ needs.checksum.outputs.hashes }}
      upload-assets: true
      compile-generator: true

  release:
    name: release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: provenance
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: "Upload dists to GitHub Release"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
          gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber
      # Upstream (jawah/utls) publishes to PyPI. Forks attach wheels to the
      # GitHub Release only — the package name `utls` is already taken.
      - name: Publish to PyPI
        if: github.repository == 'jawah/utls'
        uses: "pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e"
        with:
          attestations: true

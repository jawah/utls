[build-system]
requires = ["maturin>=1.7,<1.14"]
build-backend = "maturin"

[project]
name = "utls"
version = "2026.7.8"
description = "Drop-in ssl stdlib library using BoringSSL with first-class fingerprint impersonation."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Ahmed TAHRI" }]
keywords = ["tls", "ssl", "boringssl", "ja3", "ja4", "fingerprint", "impersonate", "chrome"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "wassima>=1,<3",
]

[project.urls]
Repository  = "https://github.com/jawah/utls"
Issues      = "https://github.com/jawah/utls/issues"
Changelog   = "https://github.com/jawah/utls/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "trustme>=1.1",
    "coverage",
    "urllib3-future",
]

[tool.maturin]
manifest-path  = "crates/utls-py/Cargo.toml"
python-source  = "python"
module-name    = "utls._utls"
features       = ["pyo3/extension-module"]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE",  format = "sdist" },
]

[tool.pytest.ini_options]
minversion       = "7.0"
testpaths        = ["tests"]
asyncio_mode     = "auto"
filterwarnings   = ["error::DeprecationWarning"]

[tool.ruff]
line-length    = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
disallow_untyped_calls      = true
disallow_untyped_decorators = true
ignore_missing_imports      = true
strict_optional             = false
warn_redundant_casts        = true
disable_error_code          = ["override", "no-any-return"]
files                       = ["python/utls"]

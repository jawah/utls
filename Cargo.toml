[workspace]
resolver = "2"
members = [
    "crates/utls-core",
    "crates/utls-py",
]

[workspace.package]
version = "2026.5.28"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/jawah/utls"
homepage = "https://github.com/jawah/utls"
authors = ["Ahmed TAHRI"]

[workspace.dependencies]
boring-sys = "5"
libc = "0.2"
thiserror = "1"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py37", "generate-import-lib"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

[workspace]
resolver = "2"
members = [
    "crates/utls-core",
    "crates/utls-py",
]

[workspace.package]
version = "2026.10.3"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/jawah/utls"
homepage = "https://github.com/jawah/utls"
authors = ["Ahmed TAHRI"]

[workspace.dependencies]
# Pinned to cloudflare/boring PR #524 for Chrome 152 signature GREASE.
boring-sys = { git = "https://github.com/cloudflare/boring", rev = "45512aac61eba490da88133d545a05419cc62d91" }
libc = "0.2"
thiserror = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py37", "generate-import-lib"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

[workspace]
resolver = "2"
members = [
    "crates/utls-core",
    "crates/utls-py",
]

[workspace.package]
version = "2026.9.3"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/xiaoweigege/utls"
homepage = "https://github.com/xiaoweigege/utls"
authors = ["Ahmed TAHRI"]

[workspace.dependencies]
# cloudflare/boring FFI. The C library itself is compiled from
# vendor/boringssl (see .cargo/config.toml) so we pick up
# SSL_CTX_set_grease_sigalgs_enabled, which this crate's vendored
# snapshot (e2a57cfb4) does not yet contain.
boring-sys = { git = "https://github.com/cloudflare/boring", rev = "931385ed41df448c82d150219f69af56e3c8399f" }
libc = "0.2"
thiserror = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py37", "generate-import-lib"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
